# ML-модель: обучается на истории попыток и подсказывает, какие
# комбинации (сервис, страна, оператор, прокси) чаще дают успех.
ml:
  model_path: ml_model.json
  learning_rate: 0.15
  l2: 0.01
  # Минимальное число попыток в истории, чтобы модель считалась обученной.
  min_samples: 10
