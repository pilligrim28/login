# ============================================================
# MassReg — шаблон конфигурации.
# Скопируйте этот файл в config.yaml и заполните свои значения.
# НЕ коммитьте config.yaml с реальными ключами (он в .gitignore).
# ============================================================

sms:
  api_key: "ВАШ_API_КЛЮЧ"       # API-ключ SMS-провайдера
  api_url: "https://46.21.159.86/stubs/handler_api.php"   # SMS-Activate v1 endpoint
  service: "Microsoft"              # Microsoft, Google, Telegram и т.д.
  country: "all"                    # all, RU, US, UA, KZ и т.д.
  max_price: 0                      # 0 = без лимита
  max_sms_wait: 300                 # секунд ожидания SMS

proxy:
  # Режим: static | iproyal | rotation
  mode: "static"
  # Отключить прокси целиком: enabled: false
  enabled: true

  # --- Режим: static ---
  type: "http"                      # http или https
  proxies:
    # - "host:port:username:password"

  # --- Режим: rotation ---
  rotation_url: ""                  # URL провайдера с автоматической ротацией

  # --- Режим: iproyal ---
  iproyal_api_key: ""               # login:password
  iproyal_country: "all"            # all, US, RU, UA, KZ и т.д.
  iproyal_length: 30                # длительность сессии в секундах (10-1200)

  # --- Общие настройки ---
  dead_timeout: 300                 # время до повторной попытки мёртвого прокси (сек)
  strategy: "round-robin"           # round-robin | random | sticky

worker:
  threads: 10                       # параллельных потоков
  total_registrations: 100          # сколько всего сделать
  headless: true                    # запуск браузера без GUI
  retry_count: 3                    # повторных попыток при ошибке

database:
  type: "sqlite"                    # sqlite или postgres
  sqlite_path: "accounts.db"
  postgres_url: "postgresql://user:pass@localhost:5432/massreg"
